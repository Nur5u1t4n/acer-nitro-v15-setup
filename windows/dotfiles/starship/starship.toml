# Starship — компактный пресет (Nerd Font icons)
# Путь: %USERPROFILE%\.config\starship.toml
# Документация: https://starship.rs/config/
#
# Нужен Nerd Font (JetBrainsMono Nerd Font / FiraCode Nerd Font)

format = """
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$package\
$nodejs\
$python\
$rust\
$cmd_duration\
$line_break\
$character"""

add_newline = true

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vicmd_symbol = "[❮](bold yellow)"

[directory]
truncation_length = 3
truncate_to_repo = true
style = "bold cyan"
read_only = " 󰌾"
read_only_style = "red"

[git_branch]
symbol = " "
style = "bold purple"
format = "on [$symbol$branch]($style) "

[git_status]
style = "bold yellow"
format = "([$all_status$ahead_behind]($style) )"
conflicted = "="
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?"
stashed = "󰆓"
modified = "!"
staged = "+"
renamed = "»"
deleted = "✘"

# Версия из package.json (имя + version)
[package]
symbol = "󰏗 "
style = "bold 208"
format = "[$symbol$version]($style) "
display_private = false

[nodejs]
symbol = " "
style = "bold green"
format = "via [$symbol($version )]($style)"
detect_files = ["package.json", ".node-version", ".nvmrc"]
detect_folders = ["node_modules"]

[python]
symbol = " "
style = "bold yellow"
format = "via [$symbol$version]($style) "
detect_files = [".python-version", "Pipfile", "pyproject.toml", "requirements.txt"]

[rust]
symbol = " "
style = "bold red"
format = "via [$symbol($version )]($style)"
detect_extensions = ["rs"]
detect_files = ["Cargo.toml"]

[cmd_duration]
min_time = 2_000
format = "took [$duration](bold yellow) "

[username]
style_user = "bold green"
style_root = "bold red"
format = "[$user]($style)@"
show_always = false

[hostname]
ssh_only = true
format = "[$hostname](bold blue) "
